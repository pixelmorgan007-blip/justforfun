<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | PhotoUP</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="admin-page">
    <div class="admin-card">
      <h1>Admin Login</h1>
      <p>Use the admin account to update the notice and add photos to the gallery.</p>
      <form id="loginForm" class="admin-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="button">Sign In</button>
        <p id="loginStatus" class="status-message"></p>
      </form>
      <p class="small-note">Default admin credentials: <strong>admin / password123</strong></p>
      <a href="photoUP.html" class="link-button">Return to Gallery</a>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
