<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PhotoUP — Discover & Stream</title>
  <link rel="stylesheet" href="PhotoUP.css" />
</head>
<body>
  <div class="liquid-mesh mesh-alpha"></div>
  <div class="liquid-mesh mesh-beta"></div>

  <header class="topbar-glass">
    <div class="topbar-brand">
      <h1>PhotoUP</h1>
      <p id="noticeText">Syncing cloud matrix...</p>
    </div>
    <div class="topbar-actions">
      <a href="index.html" class="ios-btn secondary">Home</a>
      <a href="admin-login.html" class="ios-btn secondary">Admin Portal</a>
    </div>
  </header>

  <main class="ios-fluid-body">
    <section class="search-glass-panel">
      <div class="input-wrapper">
        <input id="searchInput" type="search" placeholder="Search creators, topics, files (e.g., Cat.jpg, Surf.mp4)..." />
        <span class="search-glow"></span>
      </div>
      <div id="resultsInfo" class="results-indicator"></div>
    </section>

    <section class="publisher-panel">
      <div class="panel-header">
        <h2>Publish Canvas</h2>
        <p>Broadcast assets directly into the global storage array.</p>
      </div>
      
      <div class="publisher-grid">
        <div class="input-group">
          <label for="uploadName">Asset Name</label>
          <input id="uploadName" type="text" placeholder="Cinematic_Sequence.mp4" />
        </div>
        
        <div class="input-group">
          <label for="uploadUrl">Remote Media URL</label>
          <input id="uploadUrl" type="url" placeholder="https://domain.com/source.jpg or .mp4" />
        </div>

        <div class="input-group file-group">
          <label for="uploadFile" class="custom-file-label">
            <span class="upload-icon">✦</span> Choose Local Media
          </label>
          <input id="uploadFile" type="file" accept="image/*,video/*" />
        </div>

        <button id="uploadButton" class="ios-btn primary publish-trigger">Publish Asset</button>
      </div>
      <p id="uploadStatus" class="runtime-status"></p>
    </section>

    <section id="gallery" class="fluid-masonry"></section>
  </main>

  <div id="photoModal" class="cinema-overlay" aria-hidden="true">
    <div class="cinema-card">
      <button id="closeModal" class="dismiss-trigger" aria-label="Dismiss">✕</button>
      
      <div class="cinema-viewport" id="modalViewport">
        </div>
      
      <div class="cinema-meta">
        <h3 id="modalCaption">Asset Title</h3>
        <a id="downloadButton" class="ios-btn primary download-trigger" download>Download Source</a>
      </div>
    </div>
  </div>

  <script src="photoUP.js"></script>
</body>
</html>
